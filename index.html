<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.opts button.good{background:var(--ok);color:#fff}.opts button.bad{background:var(--bad);color:#fff}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pad button{padding:12px 0;border:0;border-radius:20px;font:inherit;font-size:26px;font-weight:800;background:rgba(255,255,255,.85);color:#0b4f86;box-shadow:0 4px 10px rgba(20,80,170,.18)}

.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 2s linear forwards;z-index:9}

.range button.on{background:linear-gradient(160deg,#2bb3a3,#2bb3e0);color:#fff}

<body>
<div class="wrap">
<header><h1>🦉 أرقامي العربية</h1><div class="stars" id="stars">⭐ 0</div></header>
<div class="subj"><button data-s="num" class="on">🔢 الأرقام</button><button data-s="let">🔤 الحروف</button></div>
<nav><button data-m="learn" class="on">تعلّم</button><button data-m="draw">اكتب</button><button data-m="quiz">اختبار</button></nav>
<div class="range" id="rng"><button class="st" id="rPrev">▶</button><select id="rSel"></select><button class="st" id="rNext">◀</button></div>

<section id="learn" class="card">
<div class="big pop" id="lNum">١</div><div class="word" id="lWord"></div><div class="small" id="lEn"></div>
<div class="btns"><button class="btn" id="lPrev">السابق</button><button class="btn o" id="lSay">🔊</button><button class="btn p" id="lNext">التالي</button></div><div class="grid" id="lGrid"></div>
</section>

<section id="lt" class="card hide">
<div class="lhead"><div class="big pop" id="tL">ا</div><div class="lmeta"><div class="word" id="tN"></div><div class="small" id="tE"></div></div><button class="btn o" id="tSay">🔊</button></div>
<div class="seg"><button id="sgF" class="on">أشكال الحرف</button><button id="sgH">مع الحركات</button></div>
<div class="forms" id="tF"></div><div class="grid g7" id="tGrid"></div>
</section>

<section id="draw" class="card hide">
<div class="small" id="dWord"></div>
<div class="fsel hide" id="fsel"></div>
<div class="cvw" id="cvw"><canvas id="cv" width="340" height="340"></canvas>
<div class="fb hide" id="dFb"><div class="face" id="dFace"></div><div class="poem" id="dPoem"></div><div class="small" id="dRate"></div></div></div>
<div class="mrow"><div class="meter"><i id="dBar"></i></div><div class="small" id="dPct">٠٪</div></div>
<div class="btns"><button class="btn" id="dClear">🧽 امسح</button><button class="btn o" id="dCheck">✔ تحقّق</button><button class="btn p hide" id="dNext">التالي ➜</button></div>

</div>

<script>

(function(){var U=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"],T={3:"ثلاثون",4:"أربعون",5:"خمسون",6:"ستون",7:"سبعون",8:"ثمانون",9:"تسعون"};

function sadTune(){[392,370,349,311,262].forEach(function(f,i){note(f,i*.38,.55,"sine",.28)})}

// range
(function(){var o=[],i;for(i=1;i<=100;i+=10)o.push([i,i+9]);o.push([1,20],[1,50],[1,100]);o.forEach(function(r){var e=document.createElement("option");e.value=r[0]+","+r[1];e.textContent="من "+ar(r[0])+" إلى "+ar(r[1]);$("rSel").appendChild(e)})})();

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){mode=b.dataset.m;
document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});
showMode();
if(mode==="draw")newDraw();if(mode==="quiz")startQuiz();}});

function buildGrid(){var g=$("lGrid");g.innerHTML="";var st=lo+Math.floor((cur-lo)/10)*10,en=Math.min(hi,st+9);for(var n=st;n<=en;n++){(function(n){var b=document.createElement("button");b.textContent=ar(n);if(n===cur)b.className="on";b.onclick=function(){showL(n)};g.appendChild(b)})(n)}}

$("lWord").textContent=W[n];$("lEn").textContent=n;

$("lSay").onclick=function(){say(W[cur])};$("lPrev").onclick=function(){showL(cur<=lo?hi:cur-1)};$("lNext").onclick=function(){showL(cur>=hi?lo:cur+1)};

var cv=$("cv"),cx=cv.getContext("2d"),dn=1,drawing=false,dDone=false,mv=0,G=1;
function mkc(){var c=document.createElement("canvas");c.width=c.height=340;return c}
